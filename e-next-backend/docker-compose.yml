services:
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "8000:80"
  #   volumes:
  #     - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - nginx_logs:/var/log/nginx
  #   depends_on:
  #     - api
  #   networks:
  #     - backend
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 256M
  #     restart_policy:
  #       condition: on-failure
  #       max_attempts: 3
    
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    # ports:
    #   - "6379:6379" 
    healthcheck:
      test: ["CMD", "redis-cli", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: ./deploy/docker/api/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    env_file:
      - .env
    ports:
      - "8090:8000"
    volumes:

      - /var/log/e-next-backend:/var/log/e-next-backend
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3

  celery_worker:
    build:
      context: .
      dockerfile: ./deploy/docker/celery/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    env_file:
      - .env
    volumes:
      - .:/app
      - /var/log/e-next-backend:/var/log/e-next-backend
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    depends_on:
      - api
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: ./deploy/docker/celery/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command: celery -A app.celery_app.celery beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./app:/app
      - /var/log/e-next-backend:/var/log/e-next-backend
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    depends_on:
      - api
      - celery_worker
      - redis

networks:
  backend:
    driver: bridge

volumes:
  nginx_logs:
  redis_data:
